<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>متو — همین حالا مسیرت را پیدا کن</title>
<link rel="stylesheet" href="shared.css" />
<style>
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 40px; }
  .wordmark { font-size: 230px; font-weight: 700; line-height: 1.1; margin-top: 18px; }
  .stripe { width: 640px; height: 20px; margin-top: 6px; }
  .tagline { font-size: 72px; font-weight: 500; margin-top: 30px; }
  .cta-line { font-size: 92px; font-weight: 700; line-height: 1.3; text-align: center; margin-top: 110px; }
  .cta-url { font-size: 170px; font-weight: 700; letter-spacing: -0.01em; color: var(--brand); direction: ltr; margin-top: 18px; line-height: 1.15; }
  .cta-pill { font-size: 48px; font-weight: 700; color: #fff; background: var(--ink); border-radius: 999px; padding: 10px 52px; margin-top: 34px; }
  .bottom-stripe { position: absolute; left: 0; right: 0; bottom: 0; height: 22px; display: flex; direction: ltr; }
  .bottom-stripe i { flex: 1; display: block; }
</style>
</head>
<body>
<div class="canvas" style="--accent: #cc0e2d">
  <div class="orb" style="top: 360px"></div>
  <div class="center">
    <div class="app-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 3.1V7a4 4 0 0 0 8 0V3.1" />
        <path d="m9 15-1-1" />

        <path d="m8 19-2 3" />
        <path d="m16 19 2 3" />
      </svg>
    </div>
    <div class="wordmark">متو</div>
    <div class="stripe">
      <i style="background: #e0001f"></i><i style="background: #2f4389"></i><i style="background: #67c5f5"></i><i style="background: #f8e100"></i><i style="background: #007e46"></i><i style="background: #ef639f"></i><i style="background: #7f0b74"></i>

    <div class="tagline">مسیریاب مترو</div>
    <div class="cta-line">همین حالا<br />مسیرت را پیدا کن</div>
    <div class="cta-url">metto.ir</div>
    <div class="cta-pill">رایگان</div>
  </div>
  <div class="bottom-stripe">
    <i style="background: #e0001f"></i><i style="background: #2f4389"></i><i style="background: #67c5f5"></i><i style="background: #f8e100"></i><i style="background: #007e46"></i><i style="background: #ef639f"></i><i style="background: #7f0b74"></i>
