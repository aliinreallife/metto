<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>متو — همه‌جا همراهت</title>
<link rel="stylesheet" href="shared.css" />
</head>
<body>
<div class="canvas" style="--accent: #cc0e2d">
  <div class="orb" style="top: 360px"></div>
  <div class="text" style="height: 340px">
    <div class="kicker">همه&zwnj;جا همراهت</div>
    <div class="title">۱۵۱ ایستگاه، ۷ خط</div>
    <div class="ldots">
      <div class="ldot" style="background: #e0001f">۱</div>
      <div class="ldot" style="background: #2f4389">۲</div>
      <div class="ldot" style="background: #67c5f5">۳</div>
      <div class="ldot" style="background: #f8e100; color: #1f1f22">۴</div>
      <div class="ldot" style="background: #007e46">۵</div>
      <div class="ldot" style="background: #ef639f">۶</div>
      <div class="ldot" style="background: #7f0b74">۷</div>
    </div>
  </div>

  <div class="pw" style="left: 114px; top: 545px; transform: scale(0.95)">
    <div class="phone">
      <div class="screen">
        <div class="punch"></div>
        <img src="../img/route-en-full.png" width="412" height="892" alt="" />
      </div>
    </div>
  </div>
  <div class="pw" style="left: 552px; top: 450px; transform: scale(0.95)">
    <div class="phone">
      <div class="screen">
        <div class="punch"></div>
        <img src="../img/route-full.png" width="412" height="892" alt="" />
      </div>
    </div>
  </div>

  <div class="checks" style="top: 1510px">
    <div class="check-row">
      <div class="check-ico"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12.5 9.5 18 20 6.5" /></svg></div>
      <div>فارسی و English</div>
    </div>
    <div class="check-row">
      <div class="check-ico"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12.5 9.5 18 20 6.5" /></svg></div>
      <div>مسیریابی بدون اینترنت</div>
    </div>
    <div class="check-row">
      <div class="check-ico"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12.5 9.5 18 20 6.5" /></svg></div>
      <div>شهرهای بیشتر در راه</div>
    </div>
  </div>
</div>
</body>
</html>
