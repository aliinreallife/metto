# Android TWA CI: validates the committed wrapper on PRs.
# Web CI (ci.yml) and Vercel stay authoritative for the Next.js/PWA build;
# this workflow never touches them. It builds the committed Gradle project
# DIRECTLY — never `bubblewrap update` (generation tool, not part of builds).
# No signing secrets are available here by design.
#
# Third-party Actions are pinned to immutable commit SHAs (comments show the
# release version). Web workflows (ci.yml, e2e.yml) keep their own pins.
name: Android CI (TWA)

on:
  pull_request:
    paths:
      - "android/**"
      - "scripts/generate-assetlinks.mjs"
      - "scripts/validate-assetlinks.mjs"
      - "scripts/android-version.mjs"
      - "scripts/check-android-config.mjs"
      - "assetlinks.test.ts"
      - "android-version.test.ts"
      - "vercel.json"
      - ".github/workflows/android-ci.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "scripts/generate-assetlinks.mjs"
      - "scripts/validate-assetlinks.mjs"
      - "scripts/android-version.mjs"
      - "scripts/check-android-config.mjs"
      - "assetlinks.test.ts"
      - "android-version.test.ts"
      - "vercel.json"
      - ".github/workflows/android-ci.yml"

permissions:
  contents: read

jobs:
  android:
    name: validate + assembleDebug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Assert committed TWA config
        # Fails on drift: package ir.metto.app, targetSdk 36, location
        # delegation, env-based signing block, pinned Bubblewrap 1.25.0.
        run: node scripts/check-android-config.mjs

      - name: Validate Digital Asset Links state
        # Pending-tolerant: exit 0 with a notice while the production file
        # does not exist yet; strict once it does.
        run: node scripts/validate-assetlinks.mjs

      - name: Smoke-test semver derivation
        run: node scripts/android-version.mjs v0.1.0

      - name: Setup JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Assemble debug (unsigned, no secrets)
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android lint assembleDebug --no-daemon --stacktrace
