# Android TWA release: signed AAB + APK attached to a GitHub Release.
#
# Flow: merge PR -> main -> `git tag vX.Y.Z && git push origin vX.Y.Z`
#   -> validate semver -> verify tag is on main -> derive versions
#   -> signed Gradle build (android-release env) -> GitHub Release.
# No Google Play auto-publishing: upload the AAB to Play Internal Testing
# manually for the first version.
#
# The `gate` job runs WITHOUT secrets and rejects bad tags before the
# environment-gated `build` job can load signing credentials.
name: Android Release (TWA)

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  gate:
    name: validate tag (no secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      versionName: ${{ steps.versions.outputs.versionName }}
      versionCode: ${{ steps.versions.outputs.versionCode }}
    steps:
      - name: Checkout (full history for ancestry check)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Strict semver validation + version derivation
        id: versions
        # Broad glob trigger above, strict gate here. Rejects v1, v1.0,
        # 1.0.0, v1.0.0-beta, v1.0.0foo — before secrets or builds.
        # versionCode = major*1_000_000 + minor*1_000 + patch (minor,patch<=999).
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag: $TAG"
          OUT="$(node scripts/android-version.mjs "$TAG")"
          echo "$OUT"
          echo "versionName=$(echo "$OUT" | sed -n 's/^versionName=//p')" >> "$GITHUB_OUTPUT"
          echo "versionCode=$(echo "$OUT" | sed -n 's/^versionCode=//p')" >> "$GITHUB_OUTPUT"

      - name: Verify tag belongs to origin/main
        # A semver tag alone must not mint a signed production build.
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $GITHUB_REF_NAME ($GITHUB_SHA) is contained in origin/main"
          else
            echo "::error::tag $GITHUB_REF_NAME ($GITHUB_SHA) is NOT on origin/main. Releases only build from main."
            exit 1
          fi

  build:
    name: signed build + GitHub Release
    needs: gate
    runs-on: ubuntu-latest
    environment: android-release
    permissions:
      contents: write
    env:
      VERSION_NAME: ${{ needs.gate.outputs.versionName }}
      VERSION_CODE: ${{ needs.gate.outputs.versionCode }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Assert committed TWA config
        run: node scripts/check-android-config.mjs

      - name: Restore upload keystore to runner temp
        # Keystore exists only in $RUNNER_TEMP for this job. Secrets are
        # never printed; the ephemeral runner discards the file afterwards.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is empty. Configure the android-release environment first (see docs/ANDROID_TWA.md)."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/metto-upload.jks"
          echo "keystore restored (${#ANDROID_KEYSTORE_BASE64} base64 chars -> $RUNNER_TEMP/metto-upload.jks)"

      - name: Signed bundle + APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/metto-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          ./android/gradlew -p android bundleRelease assembleRelease --no-daemon --stacktrace \
            "-PmettoVersionCode=$VERSION_CODE" \
            "-PmettoVersionName=$VERSION_NAME"
          ls -l android/app/build/outputs/bundle/release/ android/app/build/outputs/apk/release/

      - name: Stage artifacts + checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/metto-${GITHUB_REF_NAME}.aab"
          cp android/app/build/outputs/apk/release/app-release.apk "dist/metto-${GITHUB_REF_NAME}.apk"
          (cd dist && sha256sum "metto-${GITHUB_REF_NAME}.aab" "metto-${GITHUB_REF_NAME}.apk" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "Metto Android TWA $GITHUB_REF_NAME (versionCode $VERSION_CODE).

          Artifacts: signed .aab for Google Play Internal Testing + signed .apk (upload certificate) for direct testing, with SHA256SUMS.txt.

          After downloading: upload the .aab to Play Console > Internal Testing manually. No auto-publishing is configured." \
            "dist/metto-${GITHUB_REF_NAME}.aab" \
            "dist/metto-${GITHUB_REF_NAME}.apk" \
            dist/SHA256SUMS.txt
