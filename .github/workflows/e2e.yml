# Offline Playwright suite against a real Vercel deployment (Chromium, serial).
#
# Triggered natively by Vercel's GitHub integration: on every successful
# deployment Vercel emits a `repository_dispatch` event
# (`vercel.deployment.success`) to this repo — no dashboard webhook, PAT,
# bridge, or middleware to configure. See "How can I run end-to-end tests
# after my Vercel Preview Deployment?"
# (https://vercel.com/kb/guide/how-can-i-run-end-to-end-tests-after-my-vercel-preview-deployment).
#
# Payload contract (per that guide — do not rename without reason):
#   github.event.client_payload.url          -> deployment URL under test (BASE_URL)
#   github.event.client_payload.git.sha      -> exact deployed commit (checkout ref)
#   github.event.client_payload.environment  -> 'preview' | 'production'
#
# Environment gating: Preview deployments only, never production. The generic
# Vercel webhook `target` field is intentionally NOT used here — the
# repository_dispatch schema carries `environment` instead.
# No project-name gate: single-project repo, and the `project` payload shape
# is not part of the documented contract above.
#
# Remote suite: `test:e2e:preview` runs every spec EXCEPT `@local-only`
# (the waiting-worker test mutates the served sw.js on local disk, which is
# impossible against an immutable remote deployment). The full local suite
# stays available as `test:e2e:offline`.
#
# Speed without cutting coverage: the suite is sharded across 3 parallel jobs
# (`--shard`), and Playwright browsers are cached. Sharding is safe here even
# though local runs stay serial (playwright.config.ts: workers 1): preview
# runs hit an immutable deployment, every test gets an isolated browser
# context (service worker, cache storage and localStorage are all
# per-context), and the disk-mutating @local-only tests are excluded — so no
# shard can observe another shard's side effects.
#
# PR visibility: `repository_dispatch` runs anchor to the default branch, so
# GitHub never shows them in a PR's Checks tab. This workflow therefore posts
# its own commit status (context `Metto Preview E2E`) to the deployed SHA.
# Each shard posts pending at start (idempotent); the `report` job posts the
# single aggregate result at the end — so a stuck pending is impossible, one
# failing shard can never be overwritten by another shard, and the context
# can be made a required branch-protection check. Production dispatches are
# skipped by the job-level `if`s and post nothing.
#
# Deployment Protection: Preview deployments sit behind Vercel Authentication,
# so the suite authenticates as a Vercel Trusted Source with a short-lived
# GitHub OIDC token (no long-lived secret anywhere — see the mint step below
# and https://vercel.com/docs/deployment-protection/methods-to-bypass-deployment-protection/trusted-sources).
# Requires one manual dashboard step first: project Settings > Deployment
# Protection > Trusted Sources > External Services > Add > GitHub Actions
# (account aliinreallife, repository metto, applies to Preview environments).
# Until that rule exists, Vercel ignores the token and protected deployments
# fail at navigation with a clear 302 to SSO.
#
# NOTE (bootstrap): repository_dispatch only fires for workflow files that
# already exist on the default branch, so the first real Vercel-triggered
# run happens after this file merges. Until then, use workflow_dispatch.
name: E2E (offline)
run-name: Preview E2E ${{ github.event.client_payload.environment || 'manual' }} @ ${{ github.event.client_payload.git.sha || github.sha }} - ${{ inputs.base_url || github.event.client_payload.url }}

on:
  repository_dispatch:
    types:
      - vercel.deployment.success
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployment URL to test (e.g. a Vercel Preview URL)"
        required: true
        type: string

jobs:
  e2e:
    name: playwright offline suite (vercel preview, shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Sharded for wall-clock speed; fail-fast off so one slow shard never
    # hides the other shards' signal.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # OIDC minting needs an explicitly granted token permission; checkout
    # needs repo read; commit statuses need statuses write so the result is
    # visible on the PR. (Least privilege — no other scopes.)
    permissions:
      contents: read
      id-token: write
      statuses: write
    # Preview deployments only — never production.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.client_payload.environment == 'preview'
    env:
      BASE_URL: ${{ inputs.base_url || github.event.client_payload.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Exact deployed commit for Vercel events; the dispatched branch
          # head for manual runs (an empty ref input keeps default behavior).
          ref: ${{ github.event.client_payload.git.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Mint OIDC token for Vercel Trusted Sources
        id: oidc
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          # Default audience (https://github.com/<account>) matches the
          # dashboard rule; the token is masked and never printed.
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Validate dispatch payload
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "::error::BASE_URL is empty. repository_dispatch needs client_payload.url; manual runs need the base_url input."
            exit 1
          fi
          if [ "${{ github.event_name }}" = "repository_dispatch" ] && [ -z "${{ github.event.client_payload.git.sha }}" ]; then
            echo "::error::client_payload.git.sha is empty. Cannot pin the checkout to the deployed commit."
            exit 1
          fi
          echo "Testing $BASE_URL"
          echo "checked out: $(git rev-parse HEAD)"

      - name: Resolve status SHA
        id: target
        # repository_dispatch carries the exact deployed commit; manual runs
        # fall back to the dispatched branch head so the status still lands
        # on a meaningful commit.
        run: |
          SHA="${{ github.event.client_payload.git.sha }}"
          if [ -z "$SHA" ]; then SHA="${{ github.sha }}"; fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Metto Preview E2E status target: $SHA"

      - name: Mark Metto Preview E2E pending
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.TARGET_SHA,
              state: 'pending',
              context: 'Metto Preview E2E',
              description: 'Preview E2E suite running…',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Probe Deployment Protection (status codes only)
        # Diagnostic only, runs before the suite: proves whether the gate is
        # open, in ~10 seconds instead of a 15-minute blind run. Prints STATUS
        # CODES and public version metadata only — secrets are never printed.
        # Read as: authed 200 = gate open, suite failures below are app/test
        # issues; authed 302 = token rejected at the gate.
        env:
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          echo "deployment root with OIDC identity header -> HTTP $(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -H "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_TOKEN" "$BASE_URL/")"
          echo "deployment root anonymous -> HTTP $(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$BASE_URL/")"

      - name: Cache Playwright browsers
        # Browsers (~170 MB download) are the slow part of setup; the cache
        # key follows the lockfile so a Playwright bump re-downloads. System
        # dependencies below still install via apt on every run (fresh
        # runners have no OS package cache). Miss path == today's behavior.
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium (with OS deps)
        run: pnpm exec playwright install --with-deps chromium

      - name: Preview E2E suite (shard ${{ matrix.shard }}/3)
        # Serial within this shard (playwright.config.ts: workers 1); shards
        # run in parallel jobs — safe on preview (immutable deployment,
        # isolated browser contexts, @local-only excluded; see header).
        env:
          # Short-lived GitHub OIDC identity for this run only (masked at
          # mint; never printed, never persisted). Playwright sends it as
          # x-vercel-trusted-oidc-idp-token when present; locally unset.
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          # Long-lived automation bypass (GitHub Actions secret, never
          # hardcoded, never printed). Playwright sends it as
          # x-vercel-protection-bypass when present; locally unset.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: pnpm exec playwright test --grep-invert "@local-only" --shard=${{ matrix.shard }}/3

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-artifacts-shard-${{ matrix.shard }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            playwright-report/
            test-results/

  report:
    name: report preview E2E status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [e2e]
    # Always report, but only for preview runs: production dispatches skip
    # the matrix above and must report nothing.
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.client_payload.environment == 'preview')
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Resolve status SHA
        id: target
        # Same rule as the matrix job: exact deployed commit for Vercel
        # events, dispatched branch head for manual runs.
        run: |
          SHA="${{ github.event.client_payload.git.sha }}"
          if [ -z "$SHA" ]; then SHA="${{ github.sha }}"; fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Report aggregate Metto Preview E2E status
        # needs.e2e.result aggregates every shard: success only when all
        # three shards succeeded. Cancelled maps to error (neither green nor
        # red), matching the previous per-job behavior.
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          MATRIX_RESULT: ${{ needs.e2e.result }}
        with:
          script: |
            const result = process.env.MATRIX_RESULT;
            const state =
              result === 'success' ? 'success' : result === 'cancelled' ? 'error' : 'failure';
            const description =
              result === 'success'
                ? 'Preview E2E suite passed (3/3 shards)'
                : result === 'cancelled'
                  ? 'Preview E2E run was cancelled'
                  : `Preview E2E suite ${result} (aggregate of 3 shards)`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.TARGET_SHA,
              state,
              context: 'Metto Preview E2E',
              description,
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
